name: notebooks testing

on: [push, pull_request]

jobs:
  test-notebooks:

    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

    - name: Install dependencies for Notebooks
      run: |
        uv venv
        uv pip install -e .[visa,netw,xlsx,plot] --group dev --compile

    # test code *and* notebooks (tutorials and examples)
    - name: Test the code, tutorials and examples
      if: ${{ always() }}
      run: |
        . .venv/bin/activate
        python -m pytest --junitxml=test-results/junit-${{ matrix.python-version }}.xml --junit-prefix=${{ matrix.python-version }} --nbval-lax --nbval-current-env --dist loadscope
